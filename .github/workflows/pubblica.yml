name: Pubblica su Instagram
on:
  schedule:
    - cron: "7 * * * *"      # ogni ora; lo script controlla l'ora italiana
  workflow_dispatch:
concurrency:
  group: pubblica-ig
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pubblica i post in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
        run: python scripts/pubblica_ig.py
      - name: Salva lo stato del calendario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/calendario.json
          git diff --cached --quiet || (git commit -m "social: stato calendario" && git push)
