name: Pubblica su Instagram e Facebook
on:
  schedule:
    - cron: "7 * * * *"      # ogni ora; lo script confronta con l'ora di Roma
  workflow_dispatch:
    inputs:
      modalita:
        description: "pubblica | verifica | dry-run"
        default: pubblica
concurrency:
  group: pubblica-social
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pubblica i post in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SALVA_GIT: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ github.event.inputs.modalita }}" in
            verifica) python scripts/pubblica_ig.py --verifica ;;
            dry-run)  python scripts/pubblica_ig.py --dry-run ;;
            *)        python scripts/pubblica_ig.py ;;
          esac
